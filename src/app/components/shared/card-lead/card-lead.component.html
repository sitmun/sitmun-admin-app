<mat-card-subtitle>
  <div class="sitmun-card-lead" [class.sitmun-card-lead--stacked]="stacked">
    @if (viewerKey) {
      <span class="sitmun-card-lead-line">
        <span class="sitmun-card-lead-prefix">{{ viewerPrefixKey | translate }}</span>
        <span class="sitmun-card-lead-body" [innerHTML]="viewerKey | translate"></span>
      </span>
    }
    @if (proxyKey) {
      <span class="sitmun-card-lead-line">
        <span class="sitmun-card-lead-prefix">{{ proxyPrefixKey | translate }}</span>
        <span class="sitmun-card-lead-body" [innerHTML]="proxyKey | translate"></span>
      </span>
    }
  </div>
</mat-card-subtitle>
