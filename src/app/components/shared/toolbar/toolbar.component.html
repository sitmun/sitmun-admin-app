<mat-toolbar color="primary">
  <mat-toolbar-row class="top-toolbar-row">
    <div class=toolbar-toggle>
      <button mat-icon-button (click)="clickMenu()">
        <mat-icon class="menu">menu</mat-icon>
      </button>
    </div>
    <div class="sitmun-logo-container clickable-image">
      <div class="sitmun-logo">
        <img class="logo" src="assets/img/logos/logo_sitmun.svg" (click)="clickLogo()" (keyup.enter)="clickLogo()" tabindex="0" role="button" alt="logo">
      </div>
    </div>
    <span class="toolbar-spacer"></span>
    <button
      mat-button
      [matMenuTriggerFor]="languageMenu"
      [attr.aria-label]="'entity.login.language' | translate"
      class="language-toolbar-button">
      <mat-icon>language</mat-icon>
      <span>{{ isoCode(currentShortname) }}</span>
    </button>
    <mat-menu #languageMenu="matMenu">
      <button
        mat-menu-item
        *ngFor="let lang of languages"
        (click)="changeLanguage(lang.shortname)">
        {{ lang.name }}
      </button>
    </mat-menu>
    <app-system-info-menu></app-system-info-menu>
  </mat-toolbar-row>
</mat-toolbar>
