<app-form-toolbar
  entityType="{{ config.labelSingular }}"
  font="{{ config.font }}"
  icon="{{ config.icon }}"
  [itemName]="entityForm?.get('name')?.value"
  [isNew]="isNew()"
  [canSave]="canSaveEntity"
  [dataLoaded]="dataLoaded"
  (save)="onSaveButtonClicked()"
  (back)="utils.navigateBack()">
</app-form-toolbar>

<app-entity-form-alerts
  *ngIf="dataLoaded"
  [form]="entityForm"
  entityLabelPrefix="entity.taskGroup">
</app-entity-form-alerts>

<mat-tab-group
  mat-stretch-tabs="false"
  mat-align-tabs="end"
  [dynamicHeight]="true"
  preserveContent="true">
  <mat-tab label="{{ 'common.form.details' | translate }}">
    <form [formGroup]='entityForm' *ngIf="dataLoaded">
      <mat-card class="sitmun-mat-card-margin" appearance="outlined">
        <mat-card-content>
          <mat-form-field appearance="outline" class="half">
            <mat-label>{{ 'common.form.name' | translate }} ({{ defaultLang }})</mat-label>
            <input matInput type="text" formControlName="name"  [maxlength]="50" required>
            <mat-hint align="end">
              {{entityForm.get('name') | characterCount}}
            </mat-hint>
            <mat-icon matSuffix class="iconTranslate"
                      (click)="onTranslated('name')"
                      onKeyDown="onTranslated('name')">translate</mat-icon>
          </mat-form-field>
        </mat-card-content>
      </mat-card>
    </form>
  </mat-tab>
  <mat-tab label="{{ 'entity.taskGroup.tasks.header' | translate }}">
    <mat-card class="sitmun-mat-card-margin" appearance="outlined">
      <mat-card-content>
        <app-relation-grid
          *ngIf="dataLoaded"
          [table]="tasksTable"
          [allNewElements]="isNewOrDuplicated()"
        ></app-relation-grid>
      </mat-card-content>
    </mat-card>
  </mat-tab>
</mat-tab-group>
