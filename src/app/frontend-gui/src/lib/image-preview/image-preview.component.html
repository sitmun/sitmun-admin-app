<div #previewContainer class="preview-container" [hidden]="!isVisible || !imageSource">
  <img #previewImage [id]="previewId" alt="preview" class="previewImage" [style.max-width.px]="maxWidth" [style.max-height.px]="maxHeight">
  <div class="image-dimensions" *ngIf="imageSource && imageWidth && imageHeight">
    <ng-container *ngIf="imageFormat as format; else dimensionsOnly">
      {{ imageInfoKey | translate: { format, width: imageWidth, height: imageHeight } }}
    </ng-container>
    <ng-template #dimensionsOnly>
      {{ imageDimensionsKey | translate: { width: imageWidth, height: imageHeight } }}
    </ng-template>
    <div *ngIf="uploadResizeHintKey as resizeHintKey">
      {{ resizeHintKey | translate: { width: targetWidth, height: targetHeight } }}
    </div>
  </div>
  <button *ngIf="imageSource && showDownload" 
          (click)="downloadImage()"
          class="download-link"
          mat-button
          color="primary">
    <mat-icon>download</mat-icon>
    {{ 'entity.tree.downloadImage' | translate }}
  </button>
</div>
