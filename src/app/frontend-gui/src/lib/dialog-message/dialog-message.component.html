<h2 mat-dialog-title>{{ title | translate }}</h2>
<mat-dialog-content>
  <div class="error-details" [innerHTML]="getFormattedMessage()"></div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  @if (destructive) {
    @if (!hideCancelButton) {
      <button
        matTooltip="{{ cancelLabel | translate }}"
        mat-mini-fab
        color="primary"
        type="button"
        (click)="closeDialog()"
        cdkFocusInitial>
        <mat-icon fontSet="material-icons-round">cancel</mat-icon>
      </button>
    }
    <button
      matTooltip="{{ acceptLabel | translate }}"
      mat-mini-fab
      color="primary"
      type="button"
      class="add-half-gap"
      (click)="doAccept()">
      <mat-icon fontSet="material-icons-round">delete</mat-icon>
    </button>
  } @else {
    @if (!hideCancelButton) {
      <button
        matTooltip="{{ cancelLabel | translate }}"
        mat-mini-fab
        color="primary"
        type="button"
        (click)="closeDialog()">
        <mat-icon fontSet="material-icons-round">cancel</mat-icon>
      </button>
    }
    <button
      matTooltip="{{ acceptLabel | translate }}"
      mat-mini-fab
      color="primary"
      type="button"
      class="add-half-gap"
      (click)="doAccept()"
      cdkFocusInitial>
      <mat-icon fontSet="material-icons-round">check</mat-icon>
    </button>
  }
</mat-dialog-actions>
